mutation InsertUser($data: User_Data!) @auth(level: USER) {
  user_insert(data: $data)
}

mutation UpsertUser($data: User_Data!) @auth(level: USER) {
  user_upsert(data: $data)
}

mutation UpdateUser($id: UUID!, $data: User_Data!) @auth(level: USER) {
  user_update(id: $id, data: $data)
}

mutation DeleteUser($id: UUID!) @auth(level: USER) {
  user_delete(id: $id)
}

query GetUser($id: UUID!) @auth(level: USER) {
  user(id: $id) {
    id name email role phoneNumber avatarUrl
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Listing users is needed for public directory") {
  users {
    id name email role
  }
}

mutation InsertCategory($data: Category_Data!) @auth(level: USER) {
  category_insert(data: $data)
}

mutation UpsertCategory($data: Category_Data!) @auth(level: USER) {
  category_upsert(data: $data)
}

mutation UpdateCategory($id: UUID!, $data: Category_Data!) @auth(level: USER) {
