mutation InsertOrder($data: Order_Data!) @auth(level: USER) {
  order_insert(data: $data)
}

mutation UpsertOrder($data: Order_Data!) @auth(level: USER) {
  order_upsert(data: $data)
}

mutation UpdateOrder($id: UUID!, $data: Order_Data!) @auth(level: USER) {
  order_update(id: $id, data: $data)
}

mutation DeleteOrder($id: UUID!) @auth(level: USER) {
  order_delete(id: $id)
}

query GetOrder($id: UUID!) @auth(level: USER) {
  order(id: $id) {
    id status createdAt totalAmount user { name }
  }
}

query ListMyOrders @auth(level: USER) {
  orders(where: {userId: {eq_expr: "auth.uid"}}) {
    id status createdAt totalAmount
  }
}

